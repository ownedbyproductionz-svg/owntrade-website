<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XEON Sparplan – Tim & Lena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #05070E;
  --bg-card: #0A0E1A;
  --bg-card2: #0E1324;
  --bg-input: #0C1020;
  --bg-hover: #121A30;
  --cyan: #00D4FF;
  --cyan-soft: #00B4E6;
  --cyan-dim: rgba(0,212,255,0.10);
  --cyan-glow: rgba(0,212,255,0.35);
  --green: #00E676;
  --green-dim: rgba(0,230,118,0.10);
  --red: #FF3B5C;
  --red-dim: rgba(255,59,92,0.08);
  --gold: #FFD54F;
  --gold-dim: rgba(255,213,79,0.10);
  --pink: #FF6BCB;
  --pink-dim: rgba(255,107,203,0.10);
  --purple: #B388FF;
  --text: #E4E9F2;
  --text-mid: #8D9BC0;
  --text-dim: #556088;
  --border: rgba(255,255,255,0.05);
  --border-l: rgba(255,255,255,0.08);
  --radius: 14px;
  --font: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --handwrite: 'Caveat', cursive;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}

/* BG */
.bg-noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.35;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
}
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.5;}
.bg-orb.o1{width:600px;height:600px;top:-200px;left:-100px;background:radial-gradient(circle,rgba(0,212,255,.07),transparent 70%);}
.bg-orb.o2{width:500px;height:500px;bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(255,107,203,.05),transparent 70%);}

.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:16px 16px 80px;}

/* HEADER */
.hdr{text-align:center;padding:36px 0 24px;}
.hdr-chip{display:inline-flex;align-items:center;gap:8px;background:var(--cyan-dim);border:1px solid rgba(0,212,255,.18);border-radius:100px;padding:5px 16px;font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}
.hdr-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr h1{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-2px;line-height:1.05;
  background:linear-gradient(135deg,#fff 20%,var(--cyan) 60%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hdr .sub{font-size:14px;color:var(--text-dim);margin-top:6px;}
.hdr .sub b{color:var(--cyan);font-weight:700;}

/* SVG ICON SYSTEM */
.ic{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;}
.ic svg{width:100%;height:100%;}
.ic-lg{width:28px;height:28px;}
.ic-xl{width:36px;height:36px;}

/* NAV TABS */
.nav{display:flex;gap:2px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nav-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 8px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;border-radius:9px;transition:.2s;white-space:nowrap;}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.03);}
.nav-btn.active{background:var(--bg-card2);color:var(--cyan);box-shadow:0 2px 12px rgba(0,212,255,.12);}
.nav-btn .ic svg{fill:currentColor;stroke:currentColor;}

/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;transition:border-color .25s;}
.card:hover{border-color:var(--border-l);}
.card-t{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);font-weight:700;margin-bottom:16px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px;}
.st{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;position:relative;overflow:hidden;}
.st::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.st.st-total::before{background:linear-gradient(90deg,var(--cyan),var(--green));}
.st.st-tim::before{background:var(--cyan);}
.st.st-lena::before{background:var(--pink);}
.st.st-zins::before{background:var(--gold);}
.st-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:600;margin-bottom:6px;}
.st-val{font-family:var(--mono);font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.2;}
.st-sub{font-size:11px;color:var(--text-dim);margin-top:3px;font-family:var(--mono);}

/* FORM */
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:700;}
.fg input,.fg select,.fg textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;transition:border-color .2s;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--cyan);}
.fg select option{background:var(--bg-card);color:var(--text);}
.fg textarea{font-family:var(--font);font-size:13px;resize:vertical;min-height:60px;}
.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}

/* WHO SELECTOR */
.who{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.who-b{flex:1;padding:11px;border:none;background:var(--bg-input);color:var(--text-dim);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.who-b.a-tim{background:var(--cyan-dim);color:var(--cyan);box-shadow:inset 0 -2px 0 var(--cyan);}
.who-b.a-lena{background:var(--pink-dim);color:var(--pink);box-shadow:inset 0 -2px 0 var(--pink);}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border:none;border-radius:10px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.8px;}
.btn-p{background:linear-gradient(135deg,var(--cyan),#009FCC);color:#000;box-shadow:0 4px 20px rgba(0,212,255,.25);}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,.4);}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:8px 14px;font-size:11px;}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}
.btn-sm{padding:7px 14px;font-size:11px;border-radius:8px;}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,59,92,.15);padding:8px 14px;font-size:11px;}
.btn-danger:hover{background:rgba(255,59,92,.18);}
.btn-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.15);}
.btn-green:hover{background:rgba(0,230,118,.18);}
.btn-gold{background:var(--gold-dim);color:var(--gold);border:1px solid rgba(255,213,79,.15);}
.btn-gold:hover{background:rgba(255,213,79,.18);}

/* PROGRESS */
.prog-wrap{margin-top:12px;}
.prog-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:var(--text-dim);font-family:var(--mono);}
.prog-track{height:10px;background:rgba(255,255,255,.04);border-radius:100px;overflow:hidden;}
.prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s cubic-bezier(.4,0,.2,1);position:relative;}

/* TABLES */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:10px;font-size:13px;border-bottom:1px solid var(--border);font-family:var(--mono);}
.tbl tr:hover td{background:rgba(255,255,255,.015);}
.tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;font-family:var(--font);}
.tag-tim{background:var(--cyan-dim);color:var(--cyan);}
.tag-lena{background:var(--pink-dim);color:var(--pink);}
.amt-g{color:var(--green);}

/* SCROLL */
.scroll-y{max-height:420px;overflow-y:auto;}
.scroll-y::-webkit-scrollbar{width:3px;}
.scroll-y::-webkit-scrollbar-thumb{background:var(--border-l);border-radius:3px;}

/* STREAK */
.streak{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(135deg,var(--gold-dim),rgba(255,149,0,.06));border:1px solid rgba(255,213,79,.12);border-radius:12px;margin-bottom:14px;}
.streak-num{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--gold);}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.ach{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:10px;transition:.3s;}
.ach.u{background:var(--gold-dim);border-color:rgba(255,213,79,.18);}
.ach-ic{font-size:22px;flex-shrink:0;}
.ach-info{min-width:0;}
.ach-name{font-size:12px;font-weight:700;color:var(--text-mid);}
.ach.u .ach-name{color:var(--gold);}
.ach-desc{font-size:10px;color:var(--text-dim);}

/* PROJECTION GRID */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;}
.proj{padding:16px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);text-align:center;}
.proj-l{font-size:10px;color:var(--text-dim);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.proj-v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green);}
.proj-s{font-size:10px;color:var(--text-dim);margin-top:3px;}

/* LEADERBOARD */
.lb{display:flex;align-items:center;gap:14px;padding:14px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);background:rgba(255,255,255,.015);}
.lb-rank{font-size:26px;font-weight:900;font-family:var(--mono);width:44px;text-align:center;}
.lb-av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-size:15px;font-weight:700;}
.lb-dep{font-size:11px;color:var(--text-dim);}
.lb-amt{font-family:var(--mono);font-size:18px;font-weight:700;}

/* XEON BOX */
.xeon{background:linear-gradient(135deg,rgba(0,212,255,.06),rgba(0,230,118,.03));border:1px solid rgba(0,212,255,.12);border-radius:16px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;}
.xeon::after{content:'XEON';position:absolute;right:-8px;top:-12px;font-size:90px;font-weight:900;opacity:.03;color:var(--cyan);letter-spacing:-4px;pointer-events:none;}
.xeon h3{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.xeon p{font-size:13px;color:var(--text-mid);line-height:1.65;}
.xeon .hl{color:var(--green);font-weight:600;}
.xeon-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.xeon-tag{font-size:10px;padding:4px 10px;border-radius:100px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.12);color:var(--cyan);font-weight:600;}

/* CANVAS CHART */
.chart-wrap{position:relative;width:100%;height:280px;margin-top:12px;}
.chart-wrap canvas{width:100%!important;height:100%!important;}

/* CALC SLIDER */
.slider-row{display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;background:var(--border);border-radius:100px;outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 10px var(--cyan-glow);}
.slider-val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--cyan);min-width:90px;text-align:right;}

/* DREAM BOARD */
.dream-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.dream-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.25s;}
.dream-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4);}
.dream-img{height:140px;background-size:cover;background-position:center;position:relative;}
.dream-img::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(5,7,14,.9));}
.dream-body{padding:14px;}
.dream-name{font-size:16px;font-weight:700;margin-bottom:4px;}
.dream-cost{font-family:var(--mono);color:var(--green);font-size:14px;font-weight:600;}
.dream-note{font-size:12px;color:var(--text-dim);margin-top:4px;font-family:var(--handwrite);font-size:14px;}
.dream-actions{display:flex;gap:6px;margin-top:10px;}
.dream-prog{margin-top:8px;}
.dream-prog-t{height:6px;background:rgba(255,255,255,.04);border-radius:100px;overflow:hidden;}
.dream-prog-f{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s;}
.dream-prog-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-top:4px;font-family:var(--mono);}

/* CONFETTI */
.confetti-c{position:fixed;inset:0;pointer-events:none;z-index:9999;}
.confetti-p{position:absolute;animation:cfall 3s ease-out forwards;}
@keyframes cfall{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* EMPTY */
.empty{text-align:center;padding:36px 20px;color:var(--text-dim);}
.empty-ic{font-size:44px;margin-bottom:10px;}

/* FUN FACT */
.ff{padding:11px 14px;background:rgba(255,255,255,.015);border-radius:10px;font-size:13px;color:var(--text-mid);margin-bottom:8px;display:flex;align-items:center;gap:10px;}
.ff-ic{font-size:20px;flex-shrink:0;}

/* MOTIVATION QUOTE */
.mq{text-align:center;padding:20px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,rgba(179,136,255,.06),rgba(0,212,255,.04));border:1px solid rgba(179,136,255,.1);}
.mq-text{font-family:var(--handwrite);font-size:24px;color:var(--purple);line-height:1.3;}
.mq-author{font-size:11px;color:var(--text-dim);margin-top:6px;}

/* MILESTONE TIMELINE */
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:16px;padding-left:20px;}
.tl-dot{position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--bg);}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);box-shadow:0 0 8px var(--green-dim);}
.tl-item.next .tl-dot{background:var(--cyan);border-color:var(--cyan);animation:blink 1.5s infinite;}
.tl-label{font-size:13px;font-weight:600;}
.tl-val{font-size:12px;color:var(--text-dim);font-family:var(--mono);}

/* DELETE */
.del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:4px 8px;border-radius:6px;transition:.2s;font-family:var(--font);}
.del:hover{color:var(--red);background:var(--red-dim);}

/* SETTINGS */
.settings-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;}
.settings-row .fg{flex:1;min-width:120px;}

/* FOOTER */
.foot{text-align:center;padding:30px 0 12px;font-size:10px;color:var(--text-dim);letter-spacing:.5px;}

/* 2 COL */
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){.two{grid-template-columns:1fr;} .stats{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.stats{grid-template-columns:1fr;}}

/* MONTH GROUP */
.mg-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:8px;margin-bottom:6px;}
.mg-hdr span:first-child{font-weight:700;font-size:13px;}
.mg-hdr span:last-child{font-family:var(--mono);color:var(--green);font-weight:600;font-size:13px;}
.mg-chips{display:flex;gap:5px;margin:6px 0 10px;}
.mg-chip{font-size:10px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-family:var(--mono);}

/* BOOKING LINK */
.booking-link{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:8px;background:rgba(0,83,159,.15);border:1px solid rgba(0,83,159,.25);color:#4DA3FF;font-size:12px;font-weight:600;text-decoration:none;transition:.2s;}
.booking-link:hover{background:rgba(0,83,159,.25);transform:translateY(-1px);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:28px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;animation:modalIn .25s ease-out;}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-dim);font-size:20px;cursor:pointer;}

/* CONTRIBUTION BAR (who contributed more visually) */
.contrib-bar{display:flex;height:8px;border-radius:100px;overflow:hidden;background:var(--border);margin-top:8px;}
.contrib-tim{background:var(--cyan);transition:width .4s;}
.contrib-lena{background:var(--pink);transition:width .4s;}

/* WEEKLY CHALLENGE */
.challenge{padding:14px 18px;background:linear-gradient(135deg,rgba(0,230,118,.06),rgba(0,212,255,.04));border:1px solid rgba(0,230,118,.12);border-radius:12px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}
.challenge-ic{font-size:28px;}
.challenge-info{flex:1;}
.challenge-title{font-size:13px;font-weight:700;color:var(--green);}
.challenge-desc{font-size:12px;color:var(--text-mid);}
</style>
</head>
<body>
<div class="bg-noise"></div>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="app" id="app"></div>

<script>
// ===== SVG ICONS =====
const IC = {

// ===== HELPERS =====
function fmt(n) { return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n); }
function fmtShort(n) { if(n>=1000000) return (n/1000000).toFixed(1)+'M €'; if(n>=1000) return (n/1000).toFixed(1)+'K €'; return fmt(n); }
function fmtD(iso) { return new Date(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function tot(p) { return S.entries.filter(e=>!p||e.person===p).reduce((s,e)=>s+e.amount,0); }
function monthlyAvg() { if(!S.entries.length) return 0; const ds=S.entries.map(e=>new Date(e.date)); const mn=new Date(Math.min(...ds)); const mx=new Date(Math.max(...ds)); const m=Math.max(1,(mx.getFullYear()-mn.getFullYear())*12+mx.getMonth()-mn.getMonth()+1); return tot()/m; }
function streak() { if(!S.entries.length) return 0; const ms=new Set(); S.entries.forEach(e=>{const d=new Date(e.date);ms.add(d.getFullYear()*12+d.getMonth());}); const s=[...ms].sort((a,b)=>b-a); let c=1; for(let i=1;i<s.length;i++){if(s[i-1]-s[i]===1)c++;else break;} return c; }

function interest() {
  const r=S.rate/100; const now=new Date(); let int=0;
  S.entries.forEach(e=>{const d=new Date(e.date); const y=(now-d)/(365.25*864e5); int+=e.amount*r*y;});
  return Math.max(0,int);
}

function project(years, monthly) {
  const m = monthly || monthlyAvg() || 200;
  const r = S.rate/100/12;
  let b = tot();
  for(let i=0;i<years*12;i++) b = b*(1+r)+m;
  return b;
}

function projectData(monthly) {
  const m = monthly || S.calcMonthly || 200;
  const r = S.rate/100/12;
  let b = tot();
  const pts = [{month:0, value:b}];
  for(let i=1;i<=60;i++) { b=b*(1+r)+m; pts.push({month:i, value:b}); }
  return pts;
}

function monthGroups() {
  const g={}; S.entries.forEach(e=>{const d=new Date(e.date); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); if(!g[k])g[k]=[]; g[k].push(e);}); return g;
}

// ===== CHART DRAWING =====
function drawChart(canvasId, data, label) {
  requestAnimationFrame(()=>{
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const pad = {t:20,r:16,b:40,l:70};
    const gW = W-pad.l-pad.r, gH = H-pad.t-pad.b;

    const maxV = Math.max(...data.map(d=>d.value)) * 1.08;
    const minV = 0;

    // Grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for(let i=0;i<=5;i++){
      const y = pad.t + gH - (i/5)*gH;
      ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(W-pad.r,y); ctx.stroke();
      ctx.fillStyle='#556088'; ctx.font='11px JetBrains Mono';ctx.textAlign='right';
      ctx.fillText(fmtShort(minV+(maxV-minV)*(i/5)), pad.l-8, y+4);
    }
    // X labels
    ctx.fillStyle='#556088';ctx.font='11px JetBrains Mono';ctx.textAlign='center';
    [0,12,24,36,48,60].forEach(m=>{
      const x = pad.l+(m/(data.length-1))*gW;
      ctx.fillText(m+'M', x, H-pad.b+20);
    });

    // Area
    ctx.beginPath();
    data.forEach((d,i)=>{
      const x = pad.l+(i/(data.length-1))*gW;
      const y = pad.t+gH-(d.value-minV)/(maxV-minV)*gH;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    const lastX=pad.l+gW, firstX=pad.l;
    ctx.lineTo(lastX,pad.t+gH);ctx.lineTo(firstX,pad.t+gH);ctx.closePath();
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
    grad.addColorStop(0,'rgba(0,212,255,0.15)');grad.addColorStop(1,'rgba(0,212,255,0.01)');
    ctx.fillStyle=grad;ctx.fill();

    // Line
    ctx.beginPath();
    data.forEach((d,i)=>{
      const x=pad.l+(i/(data.length-1))*gW;
      const y=pad.t+gH-(d.value-minV)/(maxV-minV)*gH;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    });
    ctx.strokeStyle='var(--cyan)';ctx.lineWidth=2.5;ctx.stroke();

    // Goal line
    if(S.goal>0 && S.goal<=maxV){
      const gy=pad.t+gH-(S.goal-minV)/(maxV-minV)*gH;
      ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(255,213,79,0.5)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle='#FFD54F';ctx.font='bold 11px Outfit';ctx.textAlign='left';
      ctx.fillText('ZIEL: '+fmtShort(S.goal),pad.l+4,gy-6);
    }

    // End dot
    const lastPt=data[data.length-1];
    const ex=pad.l+gW,ey=pad.t+gH-(lastPt.value-minV)/(maxV-minV)*gH;
    ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);ctx.fillStyle='#00D4FF';ctx.fill();
    ctx.beginPath();ctx.arc(ex,ey,8,0,Math.PI*2);ctx.strokeStyle='rgba(0,212,255,0.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#00E676';ctx.font='bold 13px JetBrains Mono';ctx.textAlign='right';
    ctx.fillText(fmtShort(lastPt.value),ex-4,ey-14);
  });
}

function renderTab() {
  switch(tab) {

          </select>
        </div>
        <div class="fg"><label>Notiz (optional)</label><textarea id="dm-note" placeholder="Warum dieses Ziel?"></textarea></div>
        <button class="btn btn-p" onclick="saveDream()">Traumziel speichern</button>
      </div>
    </div>
  </div>`;
}

// ===== ACTIONS =====
function setTab(t) { tab=t; render(); }
function addEntry() {
  const a=parseFloat(document.getElementById('inp-amt')?.value);
  const d=document.getElementById('inp-date')?.value;
  if(!a||a<=0) return;
  const prev=achievements().filter(x=>x.u).length;
  S.entries.push({person:sel,amount:a,date:d,id:Date.now()});
  save(S);
  if(achievements().filter(x=>x.u).length>prev) confetti();
  render();
}
function delEntry(i) { if(confirm('Eintrag löschen?')){S.entries.splice(i,1);save(S);render();} }
function updateCalc(v) { S.calcMonthly=+v; save(S); render(); }
function openDreamModal() { showDreamModal=true; render(); }
function saveDream() {
  const n=document.getElementById('dm-name')?.value;
  const d=document.getElementById('dm-dest')?.value;
  const c=parseFloat(document.getElementById('dm-cost')?.value);
  const cat=document.getElementById('dm-cat')?.value;
  const note=document.getElementById('dm-note')?.value;
  if(!n||!c) return;
  S.dreams.push({name:n,destination:d||n,cost:c,category:cat||'default',note:note||''});
  save(S);showDreamModal=false;render();
  confetti();
}
function delDream(i) { if(confirm('Traumziel löschen?')){S.dreams.splice(i,1);save(S);render();} }
function exportCSV() {
  const h='Datum,Person,Betrag\n';
  const r=S.entries.map(e=>`${e.date},${e.person},${e.amount.toFixed(2)}`).join('\n');
  const b=new Blob([h+r],{type:'text/csv'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='xeon_sparplan.csv';a.click();URL.revokeObjectURL(u);
}
function exportJSON() {
  const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download='xeon_sparplan_backup.json';a.click();URL.revokeObjectURL(u);
}
function importJSON(ev) {
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{try{const d=JSON.parse(e.target.result);if(d.entries){S=d;save(S);render();confetti();}}catch(err){alert('Ungültige Datei!');}};
  r.readAsText(f);
}

// INIT
render();
</script>
</body>
</html>
