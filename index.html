<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XEON Sparplan – Tim & Lena</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#05070E;--bg-card:#0A0E1A;--bg-card2:#0E1324;--bg-input:#0C1020;
  --cyan:#00D4FF;--cyan-dim:rgba(0,212,255,.10);--cyan-glow:rgba(0,212,255,.35);
  --green:#00E676;--green-dim:rgba(0,230,118,.10);
  --red:#FF3B5C;--red-dim:rgba(255,59,92,.08);
  --gold:#FFD54F;--gold-dim:rgba(255,213,79,.10);
  --pink:#FF6BCB;--pink-dim:rgba(255,107,203,.10);
  --purple:#B388FF;
  --text:#E4E9F2;--text-mid:#8D9BC0;--text-dim:#556088;
  --border:rgba(255,255,255,.05);--border-l:rgba(255,255,255,.08);
  --radius:14px;
  --font:'Outfit',sans-serif;--mono:'JetBrains Mono',monospace;--hand:'Caveat',cursive;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}

.bg-noise{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.3;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");}
.bg-orb{position:fixed;border-radius:50%;filter:blur(100px);pointer-events:none;z-index:0;opacity:.5;}
.bg-orb.o1{width:600px;height:600px;top:-200px;left:-100px;background:radial-gradient(circle,rgba(0,212,255,.07),transparent 70%);}
.bg-orb.o2{width:500px;height:500px;bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(255,107,203,.05),transparent 70%);}

.app{position:relative;z-index:1;max-width:1140px;margin:0 auto;padding:16px 16px 80px;}

/* SYNC STATUS */
.sync-bar{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px;font-size:11px;color:var(--text-dim);background:var(--bg-card);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;}
.sync-dot{width:8px;height:8px;border-radius:50%;}
.sync-dot.ok{background:var(--green);box-shadow:0 0 6px var(--green);}
.sync-dot.loading{background:var(--gold);animation:blink 1s infinite;}
.sync-dot.err{background:var(--red);}
.sync-bar button{background:none;border:none;color:var(--cyan);cursor:pointer;font-family:var(--font);font-size:11px;font-weight:600;text-decoration:underline;}

/* HEADER */
.hdr{text-align:center;padding:30px 0 20px;}
.hdr-chip{display:inline-flex;align-items:center;gap:8px;background:var(--cyan-dim);border:1px solid rgba(0,212,255,.18);border-radius:100px;padding:5px 16px;font-size:11px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:2px;margin-bottom:14px;}
.hdr-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.hdr h1{font-size:clamp(28px,6vw,48px);font-weight:900;letter-spacing:-2px;line-height:1.05;
  background:linear-gradient(135deg,#fff 20%,var(--cyan) 60%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hdr .sub{font-size:14px;color:var(--text-dim);margin-top:6px;}
.hdr .sub b{color:var(--cyan);font-weight:700;}

/* ICONS */
.ic{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex-shrink:0;}
.ic svg{width:100%;height:100%;}
.ic-lg{width:24px;height:24px;}
.ic-xl{width:32px;height:32px;}

/* NAV */
.nav{display:flex;gap:2px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:18px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.nav::-webkit-scrollbar{height:0;}
.nav-btn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 6px;border:none;background:transparent;color:var(--text-dim);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;border-radius:9px;transition:.2s;white-space:nowrap;}
.nav-btn:hover{color:var(--text);background:rgba(255,255,255,.03);}
.nav-btn.active{background:var(--bg-card2);color:var(--cyan);box-shadow:0 2px 12px rgba(0,212,255,.12);}

/* CARDS */
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:14px;transition:border-color .25s;}
.card:hover{border-color:var(--border-l);}
.card-t{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text-dim);font-weight:700;margin-bottom:16px;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px;}
.st{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;position:relative;overflow:hidden;}
.st::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.st.st-total::before{background:linear-gradient(90deg,var(--cyan),var(--green));}
.st.st-tim::before{background:var(--cyan);}
.st.st-lena::before{background:var(--pink);}
.st.st-zins::before{background:var(--gold);}
.st-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:600;margin-bottom:5px;display:flex;align-items:center;justify-content:center;gap:4px;}
.st-val{font-family:var(--mono);font-size:clamp(18px,3.5vw,26px);font-weight:700;line-height:1.2;}
.st-sub{font-size:10px;color:var(--text-dim);margin-top:2px;font-family:var(--mono);}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:5px;}
.fg label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:700;}
.fg input,.fg select,.fg textarea{background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-family:var(--mono);font-size:14px;outline:none;transition:border-color .2s;width:100%;}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--cyan);}
.fg input.err-flash{border-color:var(--red)!important;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fg select option{background:var(--bg-card);color:var(--text);}
.fg textarea{font-family:var(--font);font-size:13px;resize:vertical;min-height:60px;}
.form-row{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}

/* WHO */
.who{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.who-b{flex:1;padding:11px;border:none;background:var(--bg-input);color:var(--text-dim);font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.who-b:hover{background:rgba(255,255,255,.03);}
.who-b.a-tim{background:var(--cyan-dim);color:var(--cyan);box-shadow:inset 0 -2px 0 var(--cyan);}
.who-b.a-lena{background:var(--pink-dim);color:var(--pink);box-shadow:inset 0 -2px 0 var(--pink);}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 22px;border:none;border-radius:10px;font-family:var(--font);font-size:13px;font-weight:700;cursor:pointer;transition:.2s;text-transform:uppercase;letter-spacing:.8px;}
.btn-p{background:linear-gradient(135deg,var(--cyan),#009FCC);color:#000;box-shadow:0 4px 20px rgba(0,212,255,.25);}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,212,255,.4);}
.btn-p:active{transform:translateY(0);}
.btn-p:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border);padding:8px 14px;font-size:11px;}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan);}
.btn-sm{padding:7px 14px;font-size:11px;border-radius:8px;}
.btn-danger{background:var(--red-dim);color:var(--red);border:1px solid rgba(255,59,92,.15);padding:8px 14px;font-size:11px;}
.btn-danger:hover{background:rgba(255,59,92,.18);}
.btn-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(0,230,118,.15);}
.btn-green:hover{background:rgba(0,230,118,.18);}

/* PROGRESS */
.prog-wrap{margin-top:10px;}
.prog-header{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11px;color:var(--text-dim);font-family:var(--mono);}
.prog-track{height:10px;background:rgba(255,255,255,.04);border-radius:100px;overflow:hidden;}
.prog-fill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s cubic-bezier(.4,0,.2,1);}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);font-weight:600;padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);}
.tbl td{padding:10px;font-size:13px;border-bottom:1px solid var(--border);font-family:var(--mono);}
.tbl tr:hover td{background:rgba(255,255,255,.015);}
.tag{display:inline-block;padding:3px 10px;border-radius:100px;font-size:11px;font-weight:700;font-family:var(--font);}
.tag-tim{background:var(--cyan-dim);color:var(--cyan);}
.tag-lena{background:var(--pink-dim);color:var(--pink);}
.amt-g{color:var(--green);}

.scroll-y{max-height:420px;overflow-y:auto;}
.scroll-y::-webkit-scrollbar{width:3px;}
.scroll-y::-webkit-scrollbar-thumb{background:var(--border-l);border-radius:3px;}

/* STREAK */
.streak{display:flex;align-items:center;gap:14px;padding:14px 18px;background:linear-gradient(135deg,var(--gold-dim),rgba(255,149,0,.06));border:1px solid rgba(255,213,79,.12);border-radius:12px;margin-bottom:14px;}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
.ach{display:flex;align-items:center;gap:8px;padding:10px 12px;background:rgba(255,255,255,.015);border:1px solid var(--border);border-radius:10px;transition:.3s;}
.ach.u{background:var(--gold-dim);border-color:rgba(255,213,79,.18);}
.ach-ic{font-size:22px;flex-shrink:0;}
.ach-info{min-width:0;}
.ach-name{font-size:12px;font-weight:700;color:var(--text-mid);}
.ach.u .ach-name{color:var(--gold);}
.ach-desc{font-size:10px;color:var(--text-dim);}

/* PROJECTIONS */
.proj-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.proj{padding:14px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--border);text-align:center;}
.proj-l{font-size:10px;color:var(--text-dim);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:1px;}
.proj-v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--green);}
.proj-s{font-size:10px;color:var(--text-dim);margin-top:2px;}

/* LEADERBOARD */
.lb{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;margin-bottom:8px;border:1px solid var(--border);background:rgba(255,255,255,.015);}
.lb-rank{font-size:24px;font-weight:900;font-family:var(--mono);width:40px;text-align:center;}
.lb-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;}
.lb-info{flex:1;min-width:0;}
.lb-name{font-size:14px;font-weight:700;}
.lb-dep{font-size:11px;color:var(--text-dim);}
.lb-amt{font-family:var(--mono);font-size:16px;font-weight:700;}

/* XEON */
.xeon{background:linear-gradient(135deg,rgba(0,212,255,.06),rgba(0,230,118,.03));border:1px solid rgba(0,212,255,.12);border-radius:16px;padding:22px;margin-bottom:14px;position:relative;overflow:hidden;}
.xeon::after{content:'XEON';position:absolute;right:-8px;top:-12px;font-size:80px;font-weight:900;opacity:.03;color:var(--cyan);letter-spacing:-4px;pointer-events:none;}
.xeon h3{font-size:15px;font-weight:700;color:var(--cyan);margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.xeon p{font-size:13px;color:var(--text-mid);line-height:1.65;}
.xeon .hl{color:var(--green);font-weight:600;}
.xeon-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.xeon-tag{font-size:10px;padding:4px 10px;border-radius:100px;background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.12);color:var(--cyan);font-weight:600;}

/* CHART */
.chart-wrap{position:relative;width:100%;height:260px;margin-top:12px;}
.chart-wrap canvas{width:100%!important;height:100%!important;}

/* SLIDER */
.slider-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.slider-row input[type=range]{flex:1;-webkit-appearance:none;height:6px;background:var(--border);border-radius:100px;outline:none;}
.slider-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--cyan);cursor:pointer;box-shadow:0 0 10px var(--cyan-glow);}
.slider-val{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--cyan);min-width:85px;text-align:right;}

/* DREAMS */
.dream-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;}
.dream-card{background:var(--bg-card2);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:.25s;}
.dream-card:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,0,0,.4);}
.dream-img{height:130px;background-size:cover;background-position:center;position:relative;}
.dream-img::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(5,7,14,.9));}
.dream-body{padding:14px;}
.dream-name{font-size:15px;font-weight:700;margin-bottom:3px;}
.dream-cost{font-family:var(--mono);color:var(--green);font-size:13px;font-weight:600;}
.dream-note{font-family:var(--hand);font-size:15px;color:var(--text-dim);margin-top:4px;}
.dream-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.dream-prog{margin-top:8px;}
.dream-prog-t{height:6px;background:rgba(255,255,255,.04);border-radius:100px;overflow:hidden;}
.dream-prog-f{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--pink),var(--purple));transition:width .4s;}
.dream-prog-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text-dim);margin-top:3px;font-family:var(--mono);}

/* BOOKING */
.booking-link{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:rgba(0,83,159,.15);border:1px solid rgba(0,83,159,.25);color:#4DA3FF;font-size:11px;font-weight:600;text-decoration:none;transition:.2s;}
.booking-link:hover{background:rgba(0,83,159,.25);transform:translateY(-1px);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);}
.modal{background:var(--bg-card);border:1px solid var(--border-l);border-radius:18px;padding:28px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;animation:modalIn .25s ease-out;position:relative;}
@keyframes modalIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* CONTRIB BAR */
.contrib-bar{display:flex;height:8px;border-radius:100px;overflow:hidden;background:var(--border);margin-top:6px;}
.contrib-tim{background:var(--cyan);transition:width .4s;}
.contrib-lena{background:var(--pink);transition:width .4s;}

/* CHALLENGE */
.challenge{padding:14px 18px;background:linear-gradient(135deg,rgba(0,230,118,.06),rgba(0,212,255,.04));border:1px solid rgba(0,230,118,.12);border-radius:12px;margin-bottom:14px;display:flex;align-items:center;gap:14px;}

/* MOTIVATION */
.mq{text-align:center;padding:18px;margin-bottom:14px;border-radius:14px;background:linear-gradient(135deg,rgba(179,136,255,.06),rgba(0,212,255,.04));border:1px solid rgba(179,136,255,.1);}
.mq-text{font-family:var(--hand);font-size:22px;color:var(--purple);line-height:1.3;}
.mq-author{font-size:11px;color:var(--text-dim);margin-top:6px;}

/* TIMELINE */
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:8px;top:0;bottom:0;width:2px;background:var(--border);}
.tl-item{position:relative;margin-bottom:14px;padding-left:20px;}
.tl-dot{position:absolute;left:-20px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid var(--border);background:var(--bg);}
.tl-item.done .tl-dot{background:var(--green);border-color:var(--green);box-shadow:0 0 8px rgba(0,230,118,.3);}
.tl-item.next .tl-dot{background:var(--cyan);border-color:var(--cyan);animation:blink 1.5s infinite;}
.tl-label{font-size:13px;font-weight:600;}
.tl-val{font-size:11px;color:var(--text-dim);font-family:var(--mono);}

/* FUN FACT */
.ff{padding:10px 14px;background:rgba(255,255,255,.015);border-radius:10px;font-size:13px;color:var(--text-mid);margin-bottom:7px;display:flex;align-items:center;gap:10px;}

/* MONTH GROUP */
.mg-hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.02);border-radius:8px;margin-bottom:6px;}
.mg-chips{display:flex;gap:5px;margin:5px 0 8px;}
.mg-chip{font-size:10px;padding:3px 9px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border);font-family:var(--mono);}

.del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:15px;padding:4px 8px;border-radius:6px;transition:.2s;font-family:var(--font);}
.del:hover{color:var(--red);background:var(--red-dim);}

.settings-row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;}
.settings-row .fg{flex:1;min-width:120px;}

.foot{text-align:center;padding:30px 0 12px;font-size:10px;color:var(--text-dim);}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:768px){.two{grid-template-columns:1fr;} .stats{grid-template-columns:1fr 1fr;}}
@media(max-width:480px){.stats{grid-template-columns:1fr;}}

.confetti-c{position:fixed;inset:0;pointer-events:none;z-index:9999;}
.confetti-p{position:absolute;animation:cfall 3s ease-out forwards;}
@keyframes cfall{0%{transform:translateY(-100vh) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

.empty{text-align:center;padding:30px 20px;color:var(--text-dim);}
.empty-ic{font-size:40px;margin-bottom:8px;}

/* SETUP SCREEN */
.setup{max-width:480px;margin:80px auto;text-align:center;}
.setup h2{font-size:28px;font-weight:800;margin-bottom:8px;color:var(--cyan);}
.setup p{font-size:14px;color:var(--text-mid);margin-bottom:24px;line-height:1.6;}
.setup .fg{text-align:left;margin-bottom:14px;}
.setup code{background:var(--bg-card2);padding:2px 8px;border-radius:6px;font-family:var(--mono);font-size:12px;color:var(--cyan);}
</style>
</head>
<body>
<div class="bg-noise"></div>
<div class="bg-orb o1"></div>
<div class="bg-orb o2"></div>
<div class="app" id="app"></div>

<script>
// ============================================================
// SVG ICONS
// ============================================================
const IC={

// ============================================================
// CLOUD SYNC (JSONbin.io FREE)
// ============================================================
// HOW IT WORKS:
// 1. First time: user creates a free bin → gets a BIN_ID
// 2. That BIN_ID goes in the config below
// 3. All writes go to JSONbin + localStorage (fallback)
// 4. On page load: fetch from JSONbin → always fresh data
//
// For owntrade.org: set these once and both Tim+Lena share data

const CONFIG_KEY = 'xeon_sp_config';
const DATA_KEY = 'xeon_sp_v4';

// JSONbin.io free tier - no API key needed for public bins
let CLOUD = loadConfig();

function loadConfig() {
  try { const c=localStorage.getItem(CONFIG_KEY); if(c) return JSON.parse(c); } catch(e){}
  return { binId:'', apiKey:'', enabled:false };
}
function saveConfig(c) { CLOUD=c; localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); }

let syncStatus = 'idle'; // idle, syncing, ok, error

async function cloudSave(data) {
  if(!CLOUD.enabled || !CLOUD.binId) { return; }
  syncStatus='syncing'; renderSyncBar();
  try {
    const headers = {'Content-Type':'application/json'};
    if(CLOUD.apiKey) headers['X-Master-Key'] = CLOUD.apiKey;
    const r = await fetch('https://api.jsonbin.io/v3/b/'+CLOUD.binId, {
      method:'PUT', headers, body:JSON.stringify(data)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    syncStatus='ok'; renderSyncBar();
  } catch(e) {
    console.error('Cloud save failed:', e);
    syncStatus='error'; renderSyncBar();
  }
}

async function cloudLoad() {
  if(!CLOUD.enabled || !CLOUD.binId) return null;
  syncStatus='syncing'; renderSyncBar();
  try {
    const headers = {};
    if(CLOUD.apiKey) headers['X-Master-Key'] = CLOUD.apiKey;
    const r = await fetch('https://api.jsonbin.io/v3/b/'+CLOUD.binId+'/latest', { headers });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    syncStatus='ok'; renderSyncBar();
    return j.record || null;
  } catch(e) {
    console.error('Cloud load failed:', e);
    syncStatus='error'; renderSyncBar();
    return null;
  }
}

async function cloudCreate(data) {
  try {
    const headers = {'Content-Type':'application/json'};
    if(CLOUD.apiKey) headers['X-Master-Key'] = CLOUD.apiKey;
    const r = await fetch('https://api.jsonbin.io/v3/b', {
      method:'POST', headers, body:JSON.stringify(data)
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    return j.metadata?.id || null;
  } catch(e) {
    console.error('Cloud create failed:', e);
    return null;
  }
}

function renderSyncBar() {
  const el = document.getElementById('sync-bar');
  if(!el) return;
  const dot = el.querySelector('.sync-dot');
  const txt = el.querySelector('.sync-txt');
  if(!dot||!txt) return;
  dot.className = 'sync-dot ' + (syncStatus==='ok'?'ok':syncStatus==='syncing'?'loading':'err');
  const labels = {idle:'Bereit',syncing:'Synchronisiere...',ok:'Cloud-Sync aktiv',error:'Sync-Fehler — Daten lokal gespeichert'};
  txt.textContent = CLOUD.enabled ? (labels[syncStatus]||'') : 'Nur lokal gespeichert';
}

const DEFAULTS = { entries:[], goal:10000, rate:2.9, dreams:[], calcMonthly:200 };

async function loadData() {
  // Try cloud first
  if(CLOUD.enabled && CLOUD.binId) {
    const cloud = await cloudLoad();
    if(cloud && cloud.entries) {
      saveLocal(cloud); // cache locally
      return cloud;
    }
  }
  // Fallback to local
  return loadLocal() || {...DEFAULTS};
}

function saveData(data) {
  saveLocal(data);
  // Async cloud save (fire and forget)
  cloudSave(data);
}

function fmt(n){return new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n);}
function fmtShort(n){if(n>=1e6)return(n/1e6).toFixed(1)+'M €';if(n>=1e3)return(n/1e3).toFixed(1)+'K €';return fmt(n);}
function fmtD(iso){return new Date(iso).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});}
function tot(p){return S.entries.filter(e=>!p||e.person===p).reduce((s,e)=>s+e.amount,0);}
function monthlyAvg(){if(!S.entries.length)return 0;const ds=S.entries.map(e=>new Date(e.date));const mn=new Date(Math.min(...ds));const mx=new Date(Math.max(...ds));const m=Math.max(1,(mx.getFullYear()-mn.getFullYear())*12+mx.getMonth()-mn.getMonth()+1);return tot()/m;}
function streak(){if(!S.entries.length)return 0;const ms=new Set();S.entries.forEach(e=>{const d=new Date(e.date);ms.add(d.getFullYear()*12+d.getMonth());});const s=[...ms].sort((a,b)=>b-a);let c=1;for(let i=1;i<s.length;i++){if(s[i-1]-s[i]===1)c++;else break;}return c;}
function interest(){const r=S.rate/100;const now=new Date();let z=0;S.entries.forEach(e=>{const d=new Date(e.date);const y=(now-d)/(365.25*864e5);z+=e.amount*r*y;});return Math.max(0,z);}
function project(years,monthly){const m=monthly||monthlyAvg()||200;const r=S.rate/100/12;let b=tot();for(let i=0;i<years*12;i++)b=b*(1+r)+m;return b;}
function projectData(monthly){const m=monthly||S.calcMonthly||200;const r=S.rate/100/12;let b=tot();const pts=[{month:0,value:b}];for(let i=1;i<=60;i++){b=b*(1+r)+m;pts.push({month:i,value:b});}return pts;}

// ============================================================
// CHART
// ============================================================
function drawChart(canvasId,data){
  requestAnimationFrame(()=>{
    const canvas=document.getElementById(canvasId);if(!canvas)return;
    const ctx=canvas.getContext('2d');
    const dpr=window.devicePixelRatio||1;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
    canvas.style.width=rect.width+'px';canvas.style.height=rect.height+'px';
    ctx.scale(dpr,dpr);
    const W=rect.width,H=rect.height;
    const pad={t:20,r:16,b:36,l:65};
    const gW=W-pad.l-pad.r,gH=H-pad.t-pad.b;
    const maxV=Math.max(...data.map(d=>d.value))*1.08;

    ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
    for(let i=0;i<=5;i++){
      const y=pad.t+gH-(i/5)*gH;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
      ctx.fillStyle='#556088';ctx.font='10px JetBrains Mono';ctx.textAlign='right';
      ctx.fillText(fmtShort(maxV*(i/5)),pad.l-8,y+4);
    }
    ctx.fillStyle='#556088';ctx.font='10px JetBrains Mono';ctx.textAlign='center';
    [0,12,24,36,48,60].forEach(m=>{const x=pad.l+(m/60)*gW;ctx.fillText(m+'M',x,H-pad.b+18);});

    // Area
    ctx.beginPath();
    data.forEach((d,i)=>{const x=pad.l+(i/60)*gW;const y=pad.t+gH-d.value/maxV*gH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.lineTo(pad.l+gW,pad.t+gH);ctx.lineTo(pad.l,pad.t+gH);ctx.closePath();
    const grad=ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
    grad.addColorStop(0,'rgba(0,212,255,0.18)');grad.addColorStop(1,'rgba(0,212,255,0.01)');
    ctx.fillStyle=grad;ctx.fill();

    // Line
    ctx.beginPath();
    data.forEach((d,i)=>{const x=pad.l+(i/60)*gW;const y=pad.t+gH-d.value/maxV*gH;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.strokeStyle='#00D4FF';ctx.lineWidth=2.5;ctx.stroke();

    // Goal line
    if(S.goal>0&&S.goal<=maxV){
      const gy=pad.t+gH-S.goal/maxV*gH;
      ctx.setLineDash([6,4]);ctx.strokeStyle='rgba(255,213,79,.5)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(pad.l,gy);ctx.lineTo(W-pad.r,gy);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#FFD54F';ctx.font='bold 10px Outfit';ctx.textAlign='left';
      ctx.fillText('ZIEL: '+fmtShort(S.goal),pad.l+4,gy-5);
    }

    // End dot
    const last=data[data.length-1];
    const ex=pad.l+gW,ey=pad.t+gH-last.value/maxV*gH;
    ctx.beginPath();ctx.arc(ex,ey,5,0,Math.PI*2);ctx.fillStyle='#00D4FF';ctx.fill();
    ctx.beginPath();ctx.arc(ex,ey,8,0,Math.PI*2);ctx.strokeStyle='rgba(0,212,255,.3)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#00E676';ctx.font='bold 12px JetBrains Mono';ctx.textAlign='right';
    ctx.fillText(fmtShort(last.value),ex-4,ey-12);
  });
}

  return '<div class="modal-overlay" onclick="if(event.target===this){showDreamModal=false;render();}"><div class="modal"><button style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer" onclick="showDreamModal=false;render()">×</button><h3>'+ic('plane')+' Neues Traumziel</h3><div style="display:grid;gap:12px"><div class="fg"><label>Name</label><input type="text" id="dm-name" placeholder="z.B. Malediven 2027"></div><div class="fg"><label>Reiseziel (für Suche)</label><input type="text" id="dm-dest" placeholder="z.B. Malediven"></div><div class="fg"><label>Budget (€)</label><input type="number" id="dm-cost" placeholder="z.B. 3000"></div><div class="fg"><label>Kategorie</label><select id="dm-cat"><option value="Strand">🏖️ Strand</option><option value="Stadt">🏙️ Stadt</option><option value="Berge">⛰️ Berge</option><option value="Roadtrip">🚗 Roadtrip</option><option value="Wellness">🧖 Wellness</option><option value="Abenteuer">🧗 Abenteuer</option></select></div><div class="fg"><label>Notiz (optional)</label><textarea id="dm-note" placeholder="Warum dieses Ziel?"></textarea></div><button class="btn btn-p" onclick="saveDream()">'+ic('plus')+' Speichern</button></div></div></div>';
}

function renderSetupScreen(){
  return `<div class="setup">
    <h2>${ic('cloud','ic-xl')} Cloud-Sync Setup</h2>
    <p>Damit Tim & Lena die gleichen Daten sehen, braucht ihr einen <b>kostenlosen JSONbin.io Account</b>.<br>Das dauert 2 Minuten:</p>
    <div class="card" style="text-align:left">
      <div style="margin-bottom:14px">
        <p style="font-size:13px;color:var(--text-mid);line-height:1.8">
          <b style="color:var(--cyan)">Schritt 1:</b> Geht auf <a href="https://jsonbin.io" target="_blank" style="color:var(--cyan)">jsonbin.io</a> und erstellt einen kostenlosen Account<br>
          <b style="color:var(--cyan)">Schritt 2:</b> Kopiert euren <b>Master Key</b> aus dem Dashboard (unter API Keys)<br>
          <b style="color:var(--cyan)">Schritt 3:</b> Tragt ihn unten ein — der Rest passiert automatisch!
        </p>
      </div>
      <div class="fg" style="margin-bottom:12px">
        <label>JSONbin Master Key</label>
        <input type="text" id="setup-key" placeholder="$2a$10$..." value="${CLOUD.apiKey||''}">
      </div>
      <div class="fg" style="margin-bottom:12px">
        <label>Bin-ID (leer lassen = neuer Bin wird erstellt)</label>

      <div style="display:flex;gap:8px">

// ============================================================
// ACTIONS
// ============================================================
function setTab(t){tab=t;render();}
function setPerson(p){sel=p;render();}

function addEntry(){
  const amtEl=document.getElementById('inp-amt');
  const dateEl=document.getElementById('inp-date');
  if(!amtEl||!dateEl) return;
  const a=parseFloat(amtEl.value);
  const d=dateEl.value;
  if(!a||a<=0||isNaN(a)){amtEl.classList.add('err-flash');setTimeout(()=>amtEl.classList.remove('err-flash'),600);return;}
  if(!d){dateEl.classList.add('err-flash');setTimeout(()=>dateEl.classList.remove('err-flash'),600);return;}
  const prev=achievements().filter(x=>x.u).length;
  S.entries.push({person:sel,amount:a,date:d,id:Date.now()});
  saveData(S);
  if(achievements().filter(x=>x.u).length>prev)confetti();
  render();
}

function delEntry(i){if(i>=0&&i<S.entries.length&&confirm('Eintrag löschen?')){S.entries.splice(i,1);saveData(S);render();}}
function updateCalc(v){S.calcMonthly=+v;saveData(S);render();}
function openDreamModal(){showDreamModal=true;render();}

function saveDream(){
  const n=document.getElementById('dm-name');
  const d=document.getElementById('dm-dest');
  const c=document.getElementById('dm-cost');
  const cat=document.getElementById('dm-cat');
  const note=document.getElementById('dm-note');
  if(!n||!c) return;
  const name=n.value.trim(),cost=parseFloat(c.value);
  if(!name){n.classList.add('err-flash');setTimeout(()=>n.classList.remove('err-flash'),600);return;}
  if(!cost||cost<=0){c.classList.add('err-flash');setTimeout(()=>c.classList.remove('err-flash'),600);return;}
  S.dreams.push({name,destination:(d?d.value.trim():'')||name,cost,category:cat?cat.value:'Strand',note:note?note.value.trim():''});
  saveData(S);showDreamModal=false;render();confetti();
}

function delDream(i){if(i>=0&&i<S.dreams.length&&confirm('Traumziel löschen?')){S.dreams.splice(i,1);saveData(S);render();}}

function resetAll(){if(confirm('⚠️ ALLE Daten unwiderruflich löschen?')&&confirm('Wirklich sicher? Das kann nicht rückgängig gemacht werden!')){S={...DEFAULTS};saveData(S);render();}}

function exportCSV(){
  const h='Datum,Person,Betrag\n';
  const r=S.entries.map(e=>e.date+','+e.person+','+e.amount.toFixed(2)).join('\n');
  dl(new Blob([h+r],{type:'text/csv'}),'xeon_sparplan.csv');
}
function exportJSON(){dl(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),'xeon_sparplan_backup.json');}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=e=>{
    try{const d=JSON.parse(e.target.result);if(d.entries&&Array.isArray(d.entries)){S=d;saveData(S);render();confetti();alert('Import erfolgreich! '+S.entries.length+' Einträge geladen.');}else{alert('Ungültiges Format!');}}
    catch(err){alert('Fehler beim Lesen der Datei!');}
  };r.readAsText(f);ev.target.value='';
}

async function setupCloud(){
  const keyEl=document.getElementById('setup-key');
  const binEl=document.getElementById('setup-bin');
  const status=document.getElementById('setup-status');
  const key=keyEl?keyEl.value.trim():'';
  const existingBin=binEl?binEl.value.trim():'';
  if(!key){status.innerHTML='<span style="color:var(--red)">Bitte Master Key eingeben!</span>';return;}
  status.innerHTML='<span style="color:var(--gold)">Verbinde...</span>';

  CLOUD.apiKey=key;

  if(existingBin){
    // Try loading existing bin
    CLOUD.binId=existingBin;CLOUD.enabled=true;saveConfig(CLOUD);
    const data=await cloudLoad();
    if(data&&data.entries){
      S=data;saveLocal(S);
      status.innerHTML='<span style="color:var(--green)">✅ Verbunden! Daten geladen.</span>';
      setTimeout(()=>{showSetup=false;render();},1500);
    } else {
      status.innerHTML='<span style="color:var(--red)">Bin-ID nicht gefunden oder leer. Neue erstellen?</span>';
      CLOUD.enabled=false;saveConfig(CLOUD);
    }
  } else {
    // Create new bin
    CLOUD.apiKey=key;
    const binId=await cloudCreate(S);
    if(binId){
      CLOUD.binId=binId;CLOUD.enabled=true;saveConfig(CLOUD);
      status.innerHTML='<span style="color:var(--green)">✅ Neuer Bin erstellt! ID: <code style="font-family:var(--mono);color:var(--cyan)">'+binId+'</code><br>Speichere diese ID — Lena braucht sie auch!</span>';
      setTimeout(()=>{showSetup=false;render();},3000);
    } else {
      status.innerHTML='<span style="color:var(--red)">Fehler beim Erstellen. Prüfe den API Key.</span>';
    }
  }
}

function disableCloud(){CLOUD.enabled=false;saveConfig(CLOUD);render();}

async function manualSync(){
  const data=await cloudLoad();
  if(data&&data.entries){
    // Merge: take the dataset with more entries or more recent entries
    const cloudLatest=data.entries.length?Math.max(...data.entries.map(e=>e.id||0)):0;
    const localLatest=S.entries.length?Math.max(...S.entries.map(e=>e.id||0)):0;
    if(cloudLatest>localLatest){
      S=data;saveLocal(S);render();
    } else if(localLatest>cloudLatest){
      await cloudSave(S);render();
    }
    // If same, do nothing
  }
}

// ============================================================
// INIT
// ============================================================
(async function init(){
  // Try cloud load on startup
  if(CLOUD.enabled&&CLOUD.binId){
    const cloud=await cloudLoad();
    if(cloud&&cloud.entries){
      const cloudLatest=cloud.entries.length?Math.max(...cloud.entries.map(e=>e.id||0)):0;
      const localLatest=S.entries.length?Math.max(...S.entries.map(e=>e.id||0)):0;
      if(cloudLatest>=localLatest){S=cloud;saveLocal(S);}
      else{await cloudSave(S);}
    }
  }
  render();
})();
</script>
